<!-- Populate the quarto-navbar-tools slot with live GitHub stars/forks widgets.
     Same pattern posit-dev/great-docs uses on their navbar. -->
<script>
(function () {
  var REPO = "HrudithL/gt-skill";
  var STARS_URL = "https://github.com/" + REPO + "/stargazers";
  var FORKS_URL = "https://github.com/" + REPO + "/network/members";
  var REPO_URL = "https://github.com/" + REPO;
  var API = "https://api.github.com/repos/" + REPO;

  function fmt(n) {
    if (n == null) return "";
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
    return String(n);
  }

  function widget(href, label, iconSvg, count) {
    var a = document.createElement("a");
    a.href = href;
    a.className = "gh-widget";
    a.setAttribute("aria-label", label);
    a.setAttribute("target", "_blank");
    a.setAttribute("rel", "noopener");
    a.innerHTML =
      '<span class="gh-widget-icon" aria-hidden="true">' + iconSvg + "</span>" +
      '<span class="gh-widget-label">' + label + "</span>" +
      '<span class="gh-widget-count">' + fmt(count) + "</span>";
    return a;
  }

  // Simple inline SVGs so we don't depend on an icon font at runtime.
  var STAR_SVG =
    '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' +
    '<path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.328.668A.75.75 0 0 1 8 .25Z"/></svg>';
  var FORK_SVG =
    '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' +
    '<path d="M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.878a2.25 2.25 0 1 1 1.5 0v.878a2.25 2.25 0 0 1-2.25 2.25h-1.5v2.128a2.251 2.251 0 1 1-1.5 0V8.5h-1.5A2.25 2.25 0 0 1 3.5 6.25v-.878a2.25 2.25 0 1 1 1.5 0ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm6.75.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm-3 8.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"/></svg>';
  var GITHUB_SVG =
    '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' +
    '<path d="M8 0C3.58 0 0 3.58 0 8a8.013 8.013 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>';

  function insertWidgets(stars, forks) {
    var container = document.querySelector(".quarto-navbar-tools");
    if (!container) return;
    // Wipe any prior render (the client-side nav in Quarto re-renders on navigate).
    container.querySelectorAll(".gh-widget, .gh-widget-icon-only").forEach(function (n) { n.remove(); });

    var starEl = widget(STARS_URL, "Star", STAR_SVG, stars);
    var forkEl = widget(FORKS_URL, "Fork", FORK_SVG, forks);

    var ghEl = document.createElement("a");
    ghEl.href = REPO_URL;
    ghEl.className = "gh-widget gh-widget-icon-only";
    ghEl.setAttribute("aria-label", "GitHub repository");
    ghEl.setAttribute("target", "_blank");
    ghEl.setAttribute("rel", "noopener");
    ghEl.innerHTML = '<span class="gh-widget-icon" aria-hidden="true">' + GITHUB_SVG + "</span>";

    container.appendChild(starEl);
    container.appendChild(forkEl);
    container.appendChild(ghEl);
  }

  function load() {
    // Show icon-only widgets immediately so there's no visible "pop" if the API is slow.
    insertWidgets(null, null);
    fetch(API, { headers: { Accept: "application/vnd.github+json" } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data) return;
        insertWidgets(data.stargazers_count, data.forks_count);
      })
      .catch(function () {
        // Rate limited or offline -- leave the icon-only widgets in place.
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", load);
  } else {
    load();
  }
})();
</script>
